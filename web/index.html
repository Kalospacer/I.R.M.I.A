<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Irmia</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/chat.css">
<link rel="stylesheet" href="/pages/overview.css">
<link rel="stylesheet" href="/pages/persona.css">
<link rel="stylesheet" href="/pages/channels.css">
<link rel="stylesheet" href="/pages/extensions.css">
<link rel="stylesheet" href="/pages/logs.css">
<link rel="stylesheet" href="/pages/settings.css">
</head>
<body>

<!-- 她的记号：灵鹿衔火（鹿首剪影 + 中央镂空火苗），全壳唯一一份图形定义 -->
<svg class="sh-sprite" aria-hidden="true" focusable="false">
  <symbol id="her-mark" viewBox="0 0 32 32">
    <path fill="currentColor"
      d="M9 4.5C10.2 8.6 12 11.4 13.2 13.2C14.2 14.4 15.1 15 16 15C16.9 15 17.8 14.4 18.8 13.2C20 11.4 21.8 8.6 23 4.5L24.2 14.2C24.2 21.2 20.4 25.8 16 25.8C11.6 25.8 7.8 21.2 7.8 14.2Z"/>
    <path fill="var(--surface, #fff)"
      d="M16 11.2C17.4 13.7 18 15.2 18 16.7C18 18.7 17 19.9 16 19.9C15 19.9 14 18.7 14 16.7C14 15.2 14.6 13.7 16 11.2Z"/>
  </symbol>
</svg>

<div class="sh-app">
  <!-- 侧边栏：品牌区（她的脸+名字+状态点）→ 主导航 → 沉底设置 -->
  <aside class="sh-rail">
    <div class="sh-brand" data-act="nav" data-page="overview" role="button" tabindex="0">
      <span class="sh-brand-face"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#her-mark"></use></svg></span>
      <span class="sh-brand-text">
        <strong>伊尔弥亚</strong>
        <span class="sh-brand-sub"><span class="sh-dot" id="sh-dot"></span><span id="sh-brand-status">正在连接…</span></span>
      </span>
    </div>

    <nav class="sh-nav" id="sh-nav" aria-label="主导航">
      <button class="sh-item" data-page="overview">
        <svg viewBox="0 0 24 24" class="sh-ico"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
        <span>运行情况</span>
      </button>
      <button class="sh-item" data-page="chat">
        <svg viewBox="0 0 24 24" class="sh-ico"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>聊天</span>
        <span class="sh-badge" id="sh-badge-chat" hidden></span>
      </button>
      <button class="sh-item" data-page="persona">
        <svg viewBox="0 0 24 24" class="sh-ico"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1-3.6 3.8-5 7-5s6 1.4 7 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>人格配置</span>
      </button>
      <button class="sh-item" data-page="channels">
        <svg viewBox="0 0 24 24" class="sh-ico"><path d="M4 8h10M4 16h10M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>消息适配器</span>
        <span class="sh-badge" id="sh-badge-channels" hidden></span>
      </button>
      <button class="sh-item" data-page="extensions">
        <svg viewBox="0 0 24 24" class="sh-ico"><path d="M10 4h4v4h4v4h-4v4h-4v-4H6V8h4V4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>扩展</span>
        <span class="sh-badge" id="sh-badge-ext" hidden></span>
      </button>
      <button class="sh-item" data-page="logs">
        <svg viewBox="0 0 24 24" class="sh-ico"><path d="M6 4h12M6 12h12M6 20h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>日志</span>
        <span class="sh-badge sh-badge-warn" id="sh-badge-logs" hidden></span>
      </button>
    </nav>

    <button class="sh-item sh-settings" data-page="settings">
      <svg viewBox="0 0 24 24" class="sh-ico"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5ZM19 12a7 7 0 0 1-.1 1.2l2 1.5-2 3.4-2.3-1a7 7 0 0 1-2.1 1.2L14 21h-4l-.5-2.7a7 7 0 0 1-2.1-1.2l-2.3 1-2-3.4 2-1.5A7 7 0 0 1 5 12c0-.4 0-.8.1-1.2l-2-1.5 2-3.4 2.3 1a7 7 0 0 1 2.1-1.2L10 3h4l.5 2.7a7 7 0 0 1 2.1 1.2l2.3-1 2 3.4-2 1.5c.1.4.1.8.1 1.2Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>设置</span>
    </button>
  </aside>

  <!-- 内容区：各页由 shell.js 按 hash 切换 -->
  <main class="sh-main" id="sh-main">
    <section class="sh-page" data-page-view="overview" id="page-overview" hidden></section>
    <section class="sh-page" data-page-view="chat" id="page-chat" hidden></section>
    <section class="sh-page" data-page-view="persona" id="page-persona" hidden></section>
    <section class="sh-page" data-page-view="channels" id="page-channels" hidden></section>
    <section class="sh-page" data-page-view="extensions" id="page-extensions" hidden></section>
    <section class="sh-page" data-page-view="logs" id="page-logs" hidden></section>
    <section class="sh-page" data-page-view="settings" id="page-settings" hidden></section>
  </main>
</div>

<!-- 令牌门：全壳共享（聊天页不再自带门） -->
<div id="sh-gate" class="gate" hidden>
  <form class="gate-card" id="sh-gate-form">
    <span class="gate-avatar"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#her-mark"></use></svg></span>
    <h2>访问令牌</h2>
    <p class="variant">粘贴启动时打印的访问令牌（token）。仅保存在本机浏览器，后续请求自动携带。</p>
    <input id="sh-gate-input" type="password" autocomplete="off" placeholder="粘贴访问令牌" spellcheck="false">
    <p class="tiny danger" id="sh-gate-error" hidden></p>
    <button class="btn btn-primary" type="submit">连接</button>
  </form>
</div>

<div class="toast-host" id="sh-toast" aria-live="polite"></div>

<script type="module" src="/shell.js"></script>
</body>
</html>

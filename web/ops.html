<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">

<symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M6 7h12v5a6 6 0 0 1-12 0zM12 18v3" fill="none" stroke="currentColor"/></symbol>

<symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor"/></symbol>
<symbol id="i-user-f" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0z" fill="currentColor"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor"/></symbol>
<symbol id="i-grid-f" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="currentColor"/></symbol>

<symbol id="i-cog-f" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="currentColor"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" fill="none" stroke="currentColor"/></symbol>

<div id="app">
<aside id="rail" class="rail" aria-label="主导航">
<div class="rail-head">
<svg class="icon rail-mark" aria-hidden="true"><use href="#i-shield-f"/></svg>
<span class="rail-brand">Irmia 运维台</span>
<span id="conn-dot" class="dot" data-online="false" title="实时连接：等待中"></span>
</div>
<nav class="rail-nav" id="rail-main">
<a class="rail-item" id="nav-chat" href="/" data-page="chat"><svg class="icon icon-off" aria-hidden="true"><use href="#i-chat"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-chat-f"/></svg><span>聊天</span></a>
<a class="rail-item" id="nav-config" href="#/config" data-page="config"><svg class="icon icon-off" aria-hidden="true"><use href="#i-sliders"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-sliders-f"/></svg><span>配置文件</span><i class="rail-badge" id="rail-badge-config" data-tone="warn" hidden></i></a>
<a class="rail-item" id="nav-plugins" href="#/plugins/skills" data-page="plugins"><svg class="icon icon-off" aria-hidden="true"><use href="#i-puzzle"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-puzzle-f"/></svg><span>插件</span><i class="rail-badge" id="rail-badge-plugins" data-tone="info" hidden></i></a>
<a class="rail-item" id="nav-data" href="#/data/stats" data-page="data"><svg class="icon icon-off" aria-hidden="true"><use href="#i-database"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-database-f"/></svg><span>数据与日志</span><i class="rail-badge" id="rail-badge-data" data-tone="danger" hidden></i></a>
<a class="rail-item" id="nav-persona" href="#/persona" data-page="persona"><svg class="icon icon-off" aria-hidden="true"><use href="#i-user"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-user-f"/></svg><span>人格</span><i class="rail-badge" id="rail-badge-persona" data-tone="info" hidden></i></a>
<a class="rail-item" id="nav-more" href="#/more" data-page="more"><svg class="icon icon-off" aria-hidden="true"><use href="#i-grid"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-grid-f"/></svg><span>更多功能</span><i class="rail-badge" id="rail-badge-more" data-tone="warn" hidden></i></a>
</nav>
<div class="rail-spacer"></div>
<nav class="rail-nav rail-nav-bottom" id="rail-bottom">
<a class="rail-item" id="nav-settings" href="#/settings/ui" data-page="settings"><svg class="icon icon-off" aria-hidden="true"><use href="#i-cog"/></svg><svg class="icon icon-on" aria-hidden="true"><use href="#i-cog-f"/></svg><span>设置</span><i class="rail-badge" id="rail-badge-settings" data-tone="warn" hidden></i></a>
</nav>
</aside>
<div class="shell">
<header class="page-head">
<div class="page-head-main">
<h1 id="page-title">配置文件</h1>
<p id="page-subtitle">模型、预算、通道与插件</p>
</div>
<div class="page-head-extra" id="page-extra"></div>
</header>
<main id="page-root" class="page-root" data-anim="out">
<div class="tabs" id="page-tabs" role="tablist" aria-label="页内分区"></div>
<div class="tab-root" id="tab-root"></div>
</main>
</div>
</div>
<button class="save-fab" id="cfg-save" data-act="ctl-save" hidden><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span class="btn-glyph" id="cfg-save-label">保存</span><svg class="icon btn-check" aria-hidden="true"><use href="#i-check"/></svg></button>
<div id="token-gate" class="gate" hidden>
<form class="gate-card" id="token-form">
<h2>接入运维台</h2>
<p class="variant">粘贴启动时控制台打印的令牌；它只存在这台机器的浏览器里。</p>
<label class="sr" for="token-input">访问令牌</label>
<input id="token-input" type="password" autocomplete="off" placeholder="粘贴令牌" spellcheck="false">
<p id="token-error" class="tiny danger" hidden></p>
<div class="row"><button class="btn btn-primary" id="token-submit" type="submit">连接</button><span class="tiny variant">重置：删掉 data/.ui-token 后重启</span></div>
</form>
</div>
<div id="confirm-dialog" class="dialog" hidden>
<div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
<h2 id="confirm-title">确认操作</h2>
<p id="confirm-body" class="variant"></p>
<div class="phrase" id="confirm-phrase">-</div>
<label class="sr" for="confirm-phrase-input">输入上方短语以继续</label>
<input id="confirm-phrase-input" type="text" autocomplete="off" spellcheck="false" placeholder="输入上方短语原文">
<div class="row"><button class="btn btn-danger" id="confirm-ok" disabled>执行</button><button class="btn" id="confirm-cancel">取消</button></div>
</div>
</div>
<div id="toast-host" class="toast-host" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
